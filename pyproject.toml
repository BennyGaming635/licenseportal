[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "licenseportal"
version = "0.1.1"
description = "Parking management system with tickets, staff tools, and dynamic pricing"
authors = [{ name="Ben" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask",
]

[project.scripts]
licenseportal = "licenseportal.cli:main"