<html>
    <head>
        <title>Car Park Management</title>
        <meta http-equiv="refresh" content="10">
        <style>
            body {
                font-family: Arial;
                background: #111;
                color: white;
                margin: 0;
                padding: 40px;
            }

            h1 {
                margin-top: 0;
            }

            table {
                width: 100%;
                border-collapse: collapse;
                background: #222;
                border-radius: 12px;
                overflow: hidden
            }

            th {
                background: #333;
                padding: 15px;
                text-align: left;
            }

            td {
                padding: 15px;
                border-top: 1px solid #444;
            }

            .paid {
                color: #00ff99;
                font-weight: bold;
            }

            .unpaid {
                color: #ffcc00;
                font-weight: bold;
            }

            .topbar {
                margin-bottom: 20px;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .refresh {
                opacity: 0.7;
                font-size: 14px;
            }
        </style>
    </head>
    <body>
        <div class="topbar">
            <h1>Current Tickets</h1>
            <div class="refresh">This will refresh every 10 seconds</div>
        </div>
        <table>
            <tr>
                <th>Ticket</th>
                <th>Status</th>
                <th>Minutes</th>
                <th>Amount Due</th>
            </tr>

            {% for ticket in tickets %}

            <tr>
                <td>{{ ticket.code }}</td>
                <td>
                    {% if ticket.paid %}
                    <span class="paid">PAID</span>
                    {% else %}
                    <span class="unpaid">UNPAID</span>
                    {% endif %}
                </td>
                <td>{{ ticket.minutes }}</td>
                <td>${{ "%.2f"|format(ticket.amount_due) }}</td>
            </tr>
            {% endfor %}
        </table>
    </body>
</html>
