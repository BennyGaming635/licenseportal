<html>
    <head>
        <title>Welcome to the Carpark</title>
        <style>
            body {
                background: #111;
                color: white;
                font-family: Arial;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                flex-direction: column;
                overflow: hidden;
            }

            .printer {
                width: 360px;
                background: #222;
                border-radius: 20px;
                padding: 25px;
                text-align: center;
                box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            }

            .printer-top {
                font-size: 28px;
                margin-bottom: 20px;
                color: white;
            }

            .ticket-slot {
                width: 100%;
                height: 160px;
                background: #111;
                border-radius: 15px;
                overflow: hidden;
                position: relative;
                margin-bottom: 20px;
            }

            .ticket-paper {
                width: 85%;
                margin: auto;
                background: white;
                color: black;
                border-radius: 10px;
                padding: 20px;
                position: absolute;
                left: 50%;
                transform: translateX(-50%) translateY(-220px);
                box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            }

            .ticket-paper.show {
                animation: printTicket 2s forwards;
            }

            .ticket-label {
                font-size: 18px;
                margin-bottom: 15px;
            }

            .ticket-code {
                font-size: 52px;
                font-weight: bold;
                letter-spacing: 5px;
            }

            .ticket-btn {

                width: 100%;
                height: 80px;

                border: none;
                border-radius: 15px;

                background: #00ff99;
                color: black;

                font-size: 28px;
                font-weight: bold;

                cursor: pointer;
            }

            .ticket-btn:active {
                transform: scale(0.97);
            }

            @keyframes printTicket {

                0% {
                    transform:
                        translateX(-50%)
                        translateY(-220px);
                }

                70% {
                    transform:
                        translateX(-50%)
                        translateY(20px);
                }

                100% {
                    transform:
                        translateX(-50%)
                        translateY(0px);
                }
            }

            .hidden {
                display: none;
            }

            .arrow {
                font-size: 120px;
                animation: bounce 1s infinite;
            }

            @keyframes bounce {
                0%,100% { transform: translateY(0); }
                50% {transform: translateY(20px); }
            }

            button {
                padding: 25px 60px;
                font-size: 40px;
                border: none;
                border-radius: 20px;
                cursor: pointer;
            }

            #ticket {
                margin-top: 40px;
                font-size: 120px;
                display: none;
            }
        </style>
    </head>
    <body>
        <div class="printer">
            <div class="printer-top">
                PRESS FOR TICKET
            </div>
            <div class="ticket-slot">
                <div id="ticket-paper" class="ticket-paper hidden">
                    <div class="tiket-label">
                        PARKING TICKET
                    </div>
                    <div id="ticket-code" class="ticket-code">
                        A41
                    </div>
                </div>
            </div>
            <button class="ticket-btn" onclick="generateTicket()">GET TICKET</button>
        </div>
        <script>
            async function generateTicket() {
                const response = await fetch("/generate_ticket");
                const data = await response.json();
                const ticketPaper = document.getElementById("ticket-paper");
                const ticketCode = document.getElementById("ticket-code");
                ticketCode.innerText = data.code;
                ticketPaper.classList.remove("hidden");
                ticketPaper.classList.add("show");
                document.getElementById("print").play();
                void ticketPaper.offsetWidth;
                ticketPaper.classList.add("show");
                setTimeout(() => {
                    ticketPaper.classList.add("hidden");
                }, 5000);
            }
        </script>
        <audio id="print">
            <source src="audio/printer.mp3" type="audio/mpeg">
        </audio>
    </body>
</html>
