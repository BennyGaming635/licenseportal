<html>
<head>
    <title>Pay for Parking</title>

    <style>
        body {
            font-family: Arial;
            background: #111;
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .card {
            background: #222;
            padding: 40px;
            border-radius: 20px;
            width: 420px;
            text-align: center;
        }

        h1 {
            margin-top: 0;
        }

        input {
            width: 100%;
            padding: 15px;
            font-size: 22px;
            border-radius: 10px;
            border: none;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 16px;
            font-size: 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 15px;
        }

        .status {
            margin-bottom: 20px;
            font-size: 18px;
        }

        .unpaid {
            color: #ffcc00;
        }

        .paid {
            color: #00ff99;
        }

        #demo-box {
            margin-top: 20px;
        }

        .small-text {
            font-size: 14px;
            opacity: 0.7;
            margin-top: 10px;
        }

        .eftpos-screen {
            background: #111;
            border: 3px solid #00ff99;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            width: 360px;
        }

        .eftpos-screen div {
            margin: 15px 0;
        }

        #eftpos-status {
            font-size: 20px;
        }

        #eftpos-amount {
            font-size: 40px;
            color: #00ff99;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

<div class="card">

    <div id="screen1">

        <h1>Parking Payment</h1>

        <input
            type="text"
            id="ticket-code"
            placeholder="Enter Ticket Code"
        >

        <button onclick="checkTicket()">
            Continue
        </button>

        <div class="small-text">
            Example codes: A41, A42...
        </div>

    </div>

    <div id="screen2" class="hidden">

        <h1>Ticket Found</h1>

        <div class="status unpaid">
            Payment Required
        </div>

        <p>
            Amount Due:
            <b id ="amount-due">$0.00 AUD</b>
        </p>
        <p>
            Parking Time:
            <b id="minutes">0 minute(s)</b>
        </p>

        <div id="payment-options">

            <button onclick="showDemoPayment()">
                Demo Payment
            </button>

            <button onclick="dummyCard()">
                Credit / Debit Card
            </button>

        </div>

        <div id="demo-box" class="hidden">

            <input
                type="password"
                id="auth-code"
                placeholder="Enter Auth Code"
            >

            <button onclick="completeDemoPayment()">
                Confirm Payment
            </button>

        </div>

    </div>

</div>
<div id="eftpos-terminal" class="hidden">
    <div class="eftpos-screen">
        <div id="eftpos-status">TAP / INSERT CARD</div>
        <div id="eftpos-amount">$0.00</div>
        <div id="eftpos-processing" class="hidden">PROCESSING...</div>
        <div id="eftpos-approved" class="hidden">APPROVED</div>
        <div id="eftpos-declined" class="hidden">DECLINED</div>
    </div>
</div>

<script>

let currentTicket = null;

function runEftpos(amount, callback) {
    const terminal = document.getElementById("eftpos-terminal");
    const status = document.getElementById("eftpos-status");
    const processing = document.getElementById("eftpos-processing");
    const approved = document.getElementById("eftpos-approved");
    terminal.classList.remove("hidden");
    document.getElementById("eftpos-amount").innerText = "$" + amount.toFixed(2);
    processing.classList.add("hidden");
    approved.classList.add("hidden");
    status.innerText = "TAP / INSERT CARD";
    setTimeout(() => {
        status.innerText = "PROCESSING...";
        processing.classList.remove("hidden")
        setTimeout(() => {
            processing.classList.add("hidden");
            approved.classList.remove("hidden");
            status.innerText = "APPROVED";
            setTimeout(() => {
                terminal.classList.add("hidden");
                callback();
            }, 1000);
        }, 1800);
    }, 1000);
}

function dummyCard() {
    const priceText = document.getElementById("amount-due").innerText;
    const amount = parseFloat(priceText.replace(/[^0-9.]/g, ""));
    runEftpos(amount, () => {
        alert("Card payment approved");
        location.reload();
    });
}

async function checkTicket() {

    const code = document
        .getElementById("ticket-code")
        .value
        .trim();

    if (!code) {

        alert("Enter a ticket code");
        return;
    }

    try {

        const response = await fetch("/check_ticket", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                code: code
            })
        });

        const data = await response.json();

        if (!data.success) {

            alert(data.error || "Invalid ticket");
            return;
        }

        if (data.paid) {

            alert("Ticket already paid");
            return;
        }

        currentTicket = code;

        const priceResponse = await fetch("/price", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                code: code
            })
        });

        const priceData = await priceResponse.json();

        if (!priceData.success) {

            alert(priceData.error || "Failed to load price");
            return;
        }

        document.getElementById("amount-due").innerText =
            "$" + priceData.amount.toFixed(2) + " AUD";

        document.getElementById("minutes").innerText =
            priceData.minutes + " minute(s)";

        document
            .getElementById("screen1")
            .classList.add("hidden");

        document
            .getElementById("screen2")
            .classList.remove("hidden");

    } catch (err) {

        console.error(err);

        alert("Something went wrong");
    }
}

function showDemoPayment() {
    const box = document.getElementById("demo-box");
    box.classList.remove("hidden");
}

async function completeDemoPayment() {

    const auth = document.getElementById("auth-code").value;

    if (auth !== "1234") {
        alert("Incorrect auth code");
        return;
    }

    const priceText = document.getElementById("amount-due").innerText;
    const amount = parseFloat(priceText.replace(/[^0-9.]/g, ""));

    runEftpos(amount, async () => {

        const response = await fetch("/mark_paid", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                code: currentTicket
            })
        });

        const data = await response.json();

        if (!data.success) {
            alert(data.error || "Payment failed");
            return;
        }

        alert("Payment successful");
        location.reload();
    });
}

async function markPaid() {

    await fetch("/mark_paid", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            code: currentTicket
        })
    });
}

</script>

</body>
</html>
