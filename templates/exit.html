<!DOCTYPE html>
<html>
<head>
    <title>Exit Terminal</title>

    <style>
        body {
            font-family: Arial;
            background: #111;
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .display {
            background: black;
            color: #00ff99;
            font-size: 42px;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            letter-spacing: 4px;
        }
        
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .keypad button {

            height: 90px;
            font-size: 32px;
            border: none;
            border-radius: 15px;
            background: #333;
            color: white;
            cursor: pointer;
        }

        .keypad button:active {
            transform: scale(0.95);
        }

        .continue-btn {
            width: 100%;
            height: 80px;
            font-size: 28px;
            border: none;
            border-radius: 15px;
        }

        .popup {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #ff4444;
            color: white;
            padding: 20px 35px;
            border-radius: 15px;
            font-size: 24px;
            z-index: 9999;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }

        .card {
            background: #222;
            padding: 40px;
            border-radius: 20px;
            width: 420px;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 15px;
            font-size: 22px;
            border: none;
            border-radius: 10px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 15px;
            font-size: 20px;
            border: none;
            border-radius: 10px;
            margin-bottom: 15px;
            cursor: pointer;
        }

        .hidden {
            display: none;
        }

        .success {
            color: #00ff99;
        }

        .warning {
            color: #ffcc00;
        }
    </style>
</head>

<body>
<div id="popup" class="popup hidden">
    <span id="popup-text"></span>
</div>

<div class="card">

    <div id="screen1">

        <h1>Exit Terminal</h1>

        <div class="display" id="ticket-display">
            ENTER TICKET
        </div>

        <div class="keypad">

            <button onclick="pressKey('1')">1</button>
            <button onclick="pressKey('2')">2</button>
            <button onclick="pressKey('3')">3</button>
            <button onclick="pressKey('4')">4</button>
            <button onclick="pressKey('5')">5</button>
            <button onclick="pressKey('6')">6</button>
            <button onclick="pressKey('7')">7</button>
            <button onclick="pressKey('8')">8</button>
            <button onclick="pressKey('9')">9</button>
            <button onclick="pressKey('A')">A</button>
            <button onclick="pressKey('0')">0</button>
            <button onclick="backspaceKey()">⌫</button>
        </div>
        <button class="continue-btn" onclick="checkExit()">
            CONTINUE
        </button>
    </div>
    <div id="screen2" class="hidden">

        <h1 class="success">
            Gate Open
        </h1>

        <p>
            Thank you
        </p>

    </div>

    <div id="screen3" class="hidden">

        <h1 class="warning">
            Payment Required
        </h1>

        <p>
            Parking: <b id="parking-amount"></b>
        </p>

        <p>
            Exit Fee: <b id="exit-fee"></b>
        </p>

        <p>
            Total Due: <b id="total-due"></b>
        </p>

        <input
            type="password"
            id="auth-code"
            placeholder="Enter Auth Code"
        >

        <button onclick="payExit()">
            Pay & Exit
        </button>

    </div>

</div>

<script>
let enteredCode = "";

function pressKey(key) {

    if (enteredCode.length >= 8)
        return;

    enteredCode += key;

    updateDisplay();
}

function backspaceKey() {

    enteredCode =
        enteredCode.slice(0, -1);

    updateDisplay();
}

function updateDisplay() {

    const display =
        document.getElementById("ticket-display");

    if (enteredCode.length === 0) {

        display.innerText = "ENTER TICKET";

    } else {

        display.innerText = enteredCode;
    }
}

function showPopup(message) {
    const popup = document.getElementById("popup");
    const text = document.getElementById("popup-text");
    text.innerText = message;
    popup.classList.remove("hidden");
    setTimeout(() => {
        popup.classList.add("hidden");
    }, 3000);
}

let currentTicket = null;

async function checkExit() {

    const code = enteredCode.trim();
    const response = await fetch("/exit_check", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            code: code
        })
    });

    const data = await response.json();

    if (!data.success) {

        showPopup(data.error || "Invalid ticket");
        return;
    }

    currentTicket = code;
    document
        .getElementById("screen1")
        .classList.add("hidden");

    if (data.paid) {
        document
            .getElementById("screen2")
            .classList.remove("hidden");

        return;
    }

    document
        .getElementById("parking-amount")
        .innerText =
            "$" + data.parking.toFixed(2);
    document
        .getElementById("exit-fee")
        .innerText =
            "$" + data.exit_fee.toFixed(2);
    document
        .getElementById("total-due")
        .innerText =
            "$" + data.total.toFixed(2);
    document
        .getElementById("screen3")
        .classList.remove("hidden");
}

async function payExit() {

    const auth = document
        .getElementById("auth-code")
        .value;

    const response = await fetch("/exit_pay", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            code: currentTicket,
            auth: auth
        })
    });

    const data = await response.json();
    if (!data.success) {

        showPopup(data.error || "Payment failed. Please try again.");
        return;
    }

    showPopup(data.message);
    location.reload();
}

</script>
</body>
</html>
