<html>
<head>
    <title>Pay for Parking</title>

    <style>
        :root {
    --bg: #081018;
    --panel: #111c2a;
    --panel2: #152538;
    --text: #f4f8ff;
    --muted: #9fb0c6;
    --accent: #00e6a8;
    --accent2: #67a8ff;
}

body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        radial-gradient(circle at top,
        rgba(103,168,255,.18),
        transparent 35%),
        radial-gradient(circle at bottom right,
        rgba(0,230,168,.16),
        transparent 30%),
        linear-gradient(
            180deg,
            #071019 0%,
            #0b1621 100%
        );

    font-family: Arial, sans-serif;
    color: var(--text);
    }

    .shell {
        width: 700px;
    }

    .header {
        background: rgba(17,28,42,.92);
        padding: 25px;
        border-radius: 24px;
        margin-bottom: 20px;
    }

    .card {
        background: rgba(17,28,42,.92);
        padding: 35px;
        border-radius: 24px;
    }

    .brand {
        color: var(--muted);
        letter-spacing: .2em;
        text-transform: uppercase;
        font-size: 13px;
    }

    input {
        width: 100%;
        padding: 16px;
        font-size: 20px;
        border: none;
        border-radius: 16px;
        background: var(--panel2);
        color: white;
        margin-bottom: 15px;
    }

    .primary-btn {
        width: 100%;
        padding: 16px;
        border: none;
        border-radius: 16px;
        background: var(--accent);
        color: #00140f;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
    }

    .secondary-btn {
        width: 100%;
        padding: 16px;
        border: none;
        border-radius: 16px;
        background: var(--panel2);
        color: white;
        font-size: 18px;
        margin-bottom: 10px;
        cursor: pointer;
    }

    .summary {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        margin-bottom: 20px;
    }

    .summary-box {
        background: rgba(255,255,255,.03);
        border-radius: 18px;
        padding: 15px;
    }

    .summary-label {
        color: var(--muted);
        font-size: 12px;
        text-transform: uppercase;
    }

    .summary-value {
        font-size: 24px;
        font-weight: bold;
    }

    .money {
        color: var(--accent);
    }

    .hidden {
        display: none;
    }
    </style>
</head>

<body>

<div class="card">
    <div id="screen1">
        <input
            type="text"
            id="ticket-code"
            placeholder="Enter ticket code"
        />
        <button class="primary-btn" onclick="checkTicket()">Continue</button>
        <div class="small-text">
            Example: A1, A2 etc
        </div>
        <div class="small-text">
            <a href="/mobile/pay">Mobile payment?</a>
        </div>
    </div>
    <div id="screen2" class="hidden">
        <h2>Ticket found!</h2>
        <div class="summary">
            <div class="summary-box">
                <div class="summary-label">Time</div>
                <div id="minutes" class="summary-value">
                    0 minute(s)
                </div>
            </div>
            <div class="summary-box">
                <div class="summary-label">Amount Due</div>
                <div id="amount-due" class="summary-value money">
                    $0.00 AUD
                </div>
            </div>
        </div>
        <button class="secondary-btn" onclick="showDemoPayment()">
            Demo payment
        </button>
        <button class="primary-btn" onclick="dummyCard()">
            Credit / Debit Card
        </button>
        <div id="demo-box" class="hidden">
            <input
                    type="password"
                    id="auth-code"
                    placeholder="Enter Auth Code"
                >

                <button class="primary-btn" onclick="completeDemoPayment()">
                    Confirm Payment
                </button>
            </div>
        </div>
    </div>
</div>
<div id="eftpos-terminal" class="hidden">
    <div class="eftpos-screen">
        <div id="eftpos-status">TAP / INSERT CARD</div>
        <div id="eftpos-amount">$0.00 AUD</div>
        <div id="eftpos-processing" class="hidden">PROCESSING...</div>
        <div id="eftpos-approved" class="hidden">APPROVED</div>
        <div id="eftpos-declined" class="hidden">DECLINED</div>
    </div>
</div>

<script>

let currentTicket = null;

const params = new URLSearchParams(window.location.search);
const ticketParam = params.get("ticket");

if (ticketParam) {
    document.getElementById("ticket-code").value = ticketParam;
}

function runEftpos(amount, callback) {
    const terminal = document.getElementById("eftpos-terminal");
    const status = document.getElementById("eftpos-status");
    const processing = document.getElementById("eftpos-processing");
    const approved = document.getElementById("eftpos-approved");
    terminal.classList.remove("hidden");
    document.getElementById("eftpos-amount").innerText = "$" + amount.toFixed(2) + " AUD";
    processing.classList.add("hidden");
    approved.classList.add("hidden");
    status.innerText = "TAP / INSERT CARD";
    setTimeout(() => {
        status.innerText = "PROCESSING...";
        processing.classList.remove("hidden")
        setTimeout(() => {
            processing.classList.add("hidden");
            approved.classList.remove("hidden");
            status.innerText = "APPROVED";
            setTimeout(() => {
                terminal.classList.add("hidden");
                callback();
            }, 1000);
        }, 1800);
    }, 1000);
}

function dummyCard() {
    const priceText = document.getElementById("amount-due").innerText;
    const amount = parseFloat(priceText.replace(/[^0-9.]/g, ""));
    
    runEftpos(amount, async () => {
        const response = await fetch("/mark_paid", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                code: currentTicket
            })
        });

        const data = await response.json();
        if (!data.success) {
            alert(data.error || "Payment failed");
            return;
        }

        location.reload();
    });
}
async function checkTicket() {

    const code = document
        .getElementById("ticket-code")
        .value
        .trim();

    if (!code) {

        alert("Enter a ticket code");
        return;
    }

    try {

        const response = await fetch("/check_ticket", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                code: code
            })
        });

        const data = await response.json();

        if (!data.success) {

            alert(data.error || "Invalid ticket");
            return;
        }

        if (data.paid) {

            alert("Ticket already paid");
            return;
        }

        currentTicket = code;

        const priceResponse = await fetch("/price", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                code: code
            })
        });

        const priceData = await priceResponse.json();

        if (!priceData.success) {

            alert(priceData.error || "Failed to load price");
            return;
        }

        document.getElementById("amount-due").innerText =
            "$" + priceData.amount.toFixed(2) + " AUD";

        document.getElementById("minutes").innerText =
            priceData.minutes + " minute(s)";

        document
            .getElementById("screen1")
            .classList.add("hidden");

        document
            .getElementById("screen2")
            .classList.remove("hidden");

    } catch (err) {

        console.error(err);

        alert("Something went wrong");
    }
}

function showDemoPayment() {
    const box = document.getElementById("demo-box");
    box.classList.remove("hidden");
}

async function completeDemoPayment() {

    const auth = document.getElementById("auth-code").value;

    if (auth !== "1234") {
        alert("Incorrect auth code");
        return;
    }

    const priceText = document.getElementById("amount-due").innerText;
    const amount = parseFloat(priceText.replace(/[^0-9.]/g, ""));

    runEftpos(amount, async () => {

        const response = await fetch("/mark_paid", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                code: currentTicket
            })
        });

        const data = await response.json();

        if (!data.success) {
            alert(data.error || "Payment failed");
            return;
        }

        alert("Payment successful");
        location.reload();
    });
}

async function markPaid() {

    await fetch("/mark_paid", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            code: currentTicket
        })
    });
}

</script>

</body>
</html>
