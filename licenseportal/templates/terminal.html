<html>
    <head>
        <title>Terminal Access</title>
        <style>
            body {
                background: #000;
                color: #00ff99;
                font-family: monospace;
                padding: 30px;
            }
            input {
                width: 100%;
                font-size: 20px;
                padding: 10px;
                background: #111;
                color: #00ff99;
                border: 1px solid #333;
            }
            button {
                margin-top: 10px;
                padding: 10px;
                font-size: 10px;
            }
            pre {
                margin-top: 20px;
                background: #111;
                padding: 15px;
                border-radius: 10px;
                white-space: pre-wrap;
            }
            a {
                color: #00ccff;
            }
        </style>
    </head>
    <body>
        <h1>Terminal Portal</h1>
        <p><a href="/staff">Back to Dashboard</a></p>
        <form method="POST">
            <input
            name="cmd"
            placeholder="Enter a command..."
            autofocus>
            <button type="submit">Run</button>
        </form>
        <pre> {{ output }}
        </pre>
    </body>
</html>
